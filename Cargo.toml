[workspace]
members = ["rust/lancedb", "nodejs"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["LanceDB Devs <dev@lancedb.com>"]
license = "Apache-2.0"
repository = "https://github.com/lancedb/lancedb"
description = "Serverless, low-latency vector database for AI applications"
keywords = ["lancedb", "lance", "database", "vector", "search"]
categories = ["database-implementations"]
rust-version = "1.91.0"

[workspace.dependencies]
lance = { default-features = false, "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-core = { "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-datagen = { "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-file = { "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-io = { default-features = false, "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-index = { "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-linalg = { "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-namespace = { "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-namespace-impls = { default-features = false, "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-table = { "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-testing = { "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-datafusion = { "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-encoding = { "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
lance-arrow = { "branch" = "main", "git" = "https://github.com/theDeltaLab/lance.git" }
ahash = "0.8"
# Note that this one does not include pyarrow
arrow = { version = "57.2", optional = false }
arrow-array = "57.2"
arrow-data = "57.2"
arrow-ipc = "57.2"
arrow-ord = "57.2"
arrow-schema = "57.2"
arrow-select = "57.2"
arrow-cast = "57.2"
async-trait = "0"
datafusion = { version = "52.1", default-features = false }
datafusion-catalog = "52.1"
datafusion-common = { version = "52.1", default-features = false }
datafusion-execution = "52.1"
datafusion-expr = "52.1"
datafusion-functions = "52.1"
datafusion-physical-plan = "52.1"
datafusion-physical-expr = "52.1"
datafusion-sql = "52.1"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "registry"] }
tracing-opentelemetry = "0.29"
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic", "http-proto", "logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.28"
half = { "version" = "2.7.1", default-features = false, features = [
    "num-traits",
] }
futures = "0"
log = "0.4"
moka = { version = "0.12", features = ["future"] }
object_store = "0.12.0"
pin-project = "1.0.7"
rand = "0.9"
snafu = "0.8"
url = "2"
num-traits = "0.2"
regex = "1.10"
lazy_static = "1"
semver = "1.0.25"
chrono = "0.4"

[workspace.metadata.upstream]
repository = "https://github.com/lancedb/lancedb"
version = "0.28.0-beta.1"

[profile.ci]
debug = "line-tables-only"
inherits = "dev"
incremental = false

# This rule applies to every package except workspace members (dependencies
# such as `arrow` and `tokio`). It disables debug info and related features on
# dependencies so their binaries stay smaller, improving cache reuse.
[profile.ci.package."*"]
debug = false
debug-assertions = false
strip = "debuginfo"
incremental = false
