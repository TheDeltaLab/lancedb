name: Create release commit

# This workflow increments versions, tags the version, and pushes it.
# When a tag is pushed, another workflow is triggered that creates a GH release
# and uploads the binaries. This workflow is only for creating the tag.

# This script will enforce that a minor version is incremented if there are any
# breaking changes since the last minor increment.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (create the local commit/tags but do not push it)'
        required: true
        default: true
        type: boolean
      type:
        description: 'What kind of release is this?'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - stable
      bump-minor:
        description: 'Bump minor version'
        required: true
        default: false
        type: boolean

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  make-release:
    # The final tag push triggers native builds and publishing.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Output Inputs
        run: echo "${{ toJSON(github.event.inputs) }}"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
          # It's important we use our token here, as the default token will NOT
          # trigger any workflows watching for new tags. See:
          # https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
          token: ${{ secrets.LANCEDB_RELEASE_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Require a branch checkout
        run: test "${{ github.ref_type }}" = branch
      - name: Validate Lance dependency is at stable version
        if: ${{ inputs.type == 'stable' }}
        run: python ci/validate_stable_lance.py
      - name: Set git configs for bumpversion
        shell: bash
        run: |
          git config user.name 'Lance Release'
          git config user.email 'lance-dev@lancedb.com'
      - name: Bump Node/Rust version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install bump-my-version==1.5.1 packaging==26.3
          bash ci/bump_version.sh ${{ inputs.type }} ${{ inputs.bump-minor }} v
      - name: Push release commit and its tag atomically
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          RELEASE_TAG=$(git describe --tags --exact-match HEAD)
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/$RELEASE_TAG"
