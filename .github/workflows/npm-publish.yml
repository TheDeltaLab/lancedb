name: NPM Publish

env:
  MACOSX_DEPLOYMENT_TARGET: '10.13'

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    # This should trigger a dry run (we skip the final publish step)
    paths:
      - .github/workflows/npm-publish.yml
      - Cargo.toml # Change in dependency frequently breaks builds
      - Cargo.lock
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ===========================================================================
#  GitHub Release (tag push only)
# ===========================================================================

jobs:
  gh-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Extract version
        id: extract_version
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -e
          echo "Extracting tag and version from $GITHUB_REF"
          if [[ $GITHUB_REF =~ refs/tags/v(.*) ]]; then
            VERSION=${BASH_REMATCH[1]}
            TAG=v$VERSION
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "Failed to extract version from $GITHUB_REF"
            exit 1
          fi
          echo "Extracted version $VERSION from $GITHUB_REF"
          if [[ $VERSION =~ beta ]]; then
            echo "This is a beta release"

            # Get last release (that is not this one)
            FROM_TAG=$(git tag --sort='version:refname' \
              | grep ^v \
              | grep -vF "$TAG" \
              | python ci/semver_sort.py v \
              | tail -n 1)
          else
            echo "This is a stable release"
            # Get last stable tag (ignore betas)
            FROM_TAG=$(git tag --sort='version:refname' \
              | grep ^v \
              | grep -vF "$TAG" \
              | grep -v beta \
              | python ci/semver_sort.py v \
              | tail -n 1)
          fi
          echo "Found from tag $FROM_TAG"
          echo "from_tag=$FROM_TAG" >> $GITHUB_OUTPUT
      - name: Create Release Notes
        id: release_notes
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: .github/release_notes.json
          toTag: ${{ steps.extract_version.outputs.tag }}
          fromTag: ${{ steps.extract_version.outputs.from_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GH release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains('beta', github.ref) }}
          tag_name: ${{ steps.extract_version.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false
          name: Node/Rust LanceDB v${{ steps.extract_version.outputs.version }}
          body: ${{ steps.release_notes.outputs.changelog }}

  # ===========================================================================
  #  LTO Build (tag push only)
  # ===========================================================================

  build-lto:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            host: macos-latest
            features: fp16kernels
            pre_build: brew install protobuf
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            features: fp16kernels
            # https://github.com/napi-rs/napi-rs/blob/main/debian.Dockerfile
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            pre_build: |-
              set -e &&
              apt-get update &&
              apt-get install -y protobuf-compiler pkg-config &&
              # The base image (manylinux2014-cross) sets TARGET_CC to the old
              # GCC 4.8 cross-compiler. aws-lc-sys checks TARGET_CC before CC,
              # so it picks up GCC even though the napi-rs image sets CC=clang.
              # Override to use the image's clang-18 which supports -fuse-ld=lld.
              export TARGET_CC=clang TARGET_CXX=clang++
    name: build-lto - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Setup sccache
        if: ${{ !matrix.settings.docker }}
        uses: mozilla-actions/sccache-action@v0.0.6
      - name: Download sccache for Docker
        if: ${{ matrix.settings.docker }}
        run: |
          SCCACHE_VERSION="v0.8.1"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin/ "sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache"
        working-directory: .
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: nodejs-lto-${{ matrix.settings.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nodejs-lto-${{ matrix.settings.target }}-cargo-
      - name: Install dependencies
        run: npm ci
      - name: Build in docker
        uses: addnab/docker-run-action@v3
        if: ${{ matrix.settings.docker }}
        with:
          image: ${{ matrix.settings.docker }}
          options: >-
            --user 0:0
            -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db
            -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache
            -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index
            -v /usr/local/bin/sccache:/usr/local/bin/sccache
            -v ${{ github.workspace }}:/build
            -w /build/nodejs
            -e ACTIONS_CACHE_URL
            -e ACTIONS_RUNTIME_TOKEN
            -e SCCACHE_GHA_ENABLED=true
            -e RUSTC_WRAPPER=sccache
          run: |
            set -e
            export CARGO_INCREMENTAL=0
            export CARGO_PROFILE_RELEASE_LTO=fat
            ${{ matrix.settings.pre_build }}
            npx napi build --platform --release \
              --features ${{ matrix.settings.features }} \
              --target ${{ matrix.settings.target }} \
              --dts ../lancedb/native.d.ts \
              --js ../lancedb/native.js \
              --strip \
              --output-dir dist/
            sccache --show-stats
      - name: Build
        run: |
          ${{ matrix.settings.pre_build }}
          npx napi build --platform --release \
              --features ${{ matrix.settings.features }} \
              --target ${{ matrix.settings.target }} \
              --dts ../lancedb/native.d.ts \
              --js ../lancedb/native.js \
              --strip \
              --output-dir dist/
        if: ${{ !matrix.settings.docker }}
        shell: bash
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
      - name: Show sccache stats
        if: ${{ always() && !matrix.settings.docker }}
        run: sccache --show-stats
        working-directory: .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lancedb-lto-${{ matrix.settings.target }}
          path: nodejs/dist/*.node
          if-no-files-found: error
      # The generic files are the same in all distros so we just pick
      # one to do the upload.
      - name: Make generic artifacts
        if: ${{ matrix.settings.target == 'aarch64-apple-darwin' }}
        run: npm run tsc
      - name: Upload Generic Artifacts
        if: ${{ matrix.settings.target == 'aarch64-apple-darwin' }}
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-dist-lto
          path: |
            nodejs/dist/*
            !nodejs/dist/*.node

  # ===========================================================================
  #  LTO Test (tag push only)
  # ===========================================================================

  test-lto:
    name: "test-lto: ${{ matrix.settings.target }} - node@${{ matrix.node }}"
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-lto
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
        node:
          - '20'
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lancedb-lto-${{ matrix.settings.target }}
          path: nodejs/dist/
      - uses: actions/download-artifact@v4
        with:
          name: nodejs-dist-lto
          path: nodejs/dist
      - name: List packages
        run: ls -R dist
      - name: Move built files
        run: cp dist/native.d.ts dist/native.js dist/*.node lancedb/
      - name: Test bindings
        run: npm test

  # ===========================================================================
  #  LTO Publish (tag push only)
  # ===========================================================================

  publish-lto:
    name: Publish (LTO)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: nodejs
    needs:
      - test-lto
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: nodejs-dist-lto
          path: nodejs/dist
      - uses: actions/download-artifact@v4
        name: Download arch-specific binaries
        with:
          pattern: lancedb-lto-*
          path: nodejs/nodejs-artifacts
          merge-multiple: true
      - name: Display structure of downloaded files
        run: find dist && find nodejs-artifacts
      - name: Move artifacts
        run: npx napi artifacts -d nodejs-artifacts
      - name: List packages
        run: find npm
      - name: Determine version and publish mode
        id: versioning
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          VERSION="$BASE_VERSION"
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG="preview"
          else
            NPM_TAG="latest"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION with tag: $NPM_TAG"
      - name: Publish
        run: |
          npm config set provenance true
          npm publish --access public --tag ${{ steps.versioning.outputs.npm_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ===========================================================================
  #  Non-LTO Build (always runs)
  # ===========================================================================

  build-nonlto:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            host: macos-latest
            features: fp16kernels
            pre_build: brew install protobuf
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            features: fp16kernels
            # https://github.com/napi-rs/napi-rs/blob/main/debian.Dockerfile
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            pre_build: |-
              set -e &&
              apt-get update &&
              apt-get install -y protobuf-compiler pkg-config &&
              # The base image (manylinux2014-cross) sets TARGET_CC to the old
              # GCC 4.8 cross-compiler. aws-lc-sys checks TARGET_CC before CC,
              # so it picks up GCC even though the napi-rs image sets CC=clang.
              # Override to use the image's clang-18 which supports -fuse-ld=lld.
              export TARGET_CC=clang TARGET_CXX=clang++
    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Setup sccache
        if: ${{ !matrix.settings.docker }}
        uses: mozilla-actions/sccache-action@v0.0.6
      - name: Download sccache for Docker
        if: ${{ matrix.settings.docker }}
        run: |
          SCCACHE_VERSION="v0.8.1"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin/ "sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache"
        working-directory: .
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: nodejs-${{ matrix.settings.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nodejs-${{ matrix.settings.target }}-cargo-
      - name: Install dependencies
        run: npm ci
      - name: Build in docker
        uses: addnab/docker-run-action@v3
        if: ${{ matrix.settings.docker }}
        with:
          image: ${{ matrix.settings.docker }}
          options: >-
            --user 0:0
            -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db
            -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache
            -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index
            -v /usr/local/bin/sccache:/usr/local/bin/sccache
            -v ${{ github.workspace }}:/build
            -w /build/nodejs
            -e ACTIONS_CACHE_URL
            -e ACTIONS_RUNTIME_TOKEN
            -e SCCACHE_GHA_ENABLED=true
            -e RUSTC_WRAPPER=sccache
          run: |
            set -e
            export CARGO_PROFILE_RELEASE_LTO=false
            ${{ matrix.settings.pre_build }}
            npx napi build --platform --release \
              --features ${{ matrix.settings.features }} \
              --target ${{ matrix.settings.target }} \
              --dts ../lancedb/native.d.ts \
              --js ../lancedb/native.js \
              --strip \
              --output-dir dist/
            sccache --show-stats
      - name: Build
        run: |
          ${{ matrix.settings.pre_build }}
          npx napi build --platform --release \
              --features ${{ matrix.settings.features }} \
              --target ${{ matrix.settings.target }} \
              --dts ../lancedb/native.d.ts \
              --js ../lancedb/native.js \
              --strip \
              --output-dir dist/
        if: ${{ !matrix.settings.docker }}
        shell: bash
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
      - name: Show sccache stats
        if: ${{ always() && !matrix.settings.docker }}
        run: sccache --show-stats
        working-directory: .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lancedb-nonlto-${{ matrix.settings.target }}
          path: nodejs/dist/*.node
          if-no-files-found: error
      # The generic files are the same in all distros so we just pick
      # one to do the upload.
      - name: Make generic artifacts
        if: ${{ matrix.settings.target == 'aarch64-apple-darwin' }}
        run: npm run tsc
      - name: Upload Generic Artifacts
        if: ${{ matrix.settings.target == 'aarch64-apple-darwin' }}
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-dist-nonlto
          path: |
            nodejs/dist/*
            !nodejs/dist/*.node

  # ===========================================================================
  #  Non-LTO Test
  # ===========================================================================

  test-nonlto:
    name: "Test: ${{ matrix.settings.target }} - node@${{ matrix.node }}"
    needs:
      - build-nonlto
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
        node:
          - '20'
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lancedb-nonlto-${{ matrix.settings.target }}
          path: nodejs/dist/
      - uses: actions/download-artifact@v4
        with:
          name: nodejs-dist-nonlto
          path: nodejs/dist
      - name: List packages
        run: ls -R dist
      - name: Move built files
        run: cp dist/native.d.ts dist/native.js dist/*.node lancedb/
      - name: Test bindings
        run: npm test

  # ===========================================================================
  #  Non-LTO Publish
  # ===========================================================================

  publish-nonlto:
    name: Publish (Non-LTO)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: nodejs
    needs:
      - test-nonlto
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: nodejs-dist-nonlto
          path: nodejs/dist
      - uses: actions/download-artifact@v4
        name: Download arch-specific binaries
        with:
          pattern: lancedb-nonlto-*
          path: nodejs/nodejs-artifacts
          merge-multiple: true
      - name: Display structure of downloaded files
        run: find dist && find nodejs-artifacts
      - name: Move artifacts
        run: npx napi artifacts -d nodejs-artifacts
      - name: List packages
        run: find npm
      - name: Determine version and publish mode
        id: versioning
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.release_type }}" == "nightly" ]]; then
            SHORT_SHA=$(git rev-parse --short=6 HEAD)
            VERSION="${BASE_VERSION}-nightly.${SHORT_SHA}"
            NPM_TAG="nightly"
            DRY_RUN=false
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${BASE_VERSION}-nonlto"
            NPM_TAG="nonlto"
            DRY_RUN=false
          else
            VERSION="$BASE_VERSION"
            NPM_TAG="latest"
            DRY_RUN=true
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION with tag: $NPM_TAG (dry_run: $DRY_RUN)"
      - name: Update package versions
        if: steps.versioning.outputs.dry_run == 'false'
        run: |
          node << 'EOF'
            const fs = require('fs');
            const path = require('path');
            const version = process.env.VERSION;

            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            pkg.version = version;
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Main:', pkg.name, pkg.version);

            const npmDir = './npm';
            if (fs.existsSync(npmDir)) {
              for (const platform of fs.readdirSync(npmDir)) {
                const p = path.join(npmDir, platform, 'package.json');
                if (fs.existsSync(p)) {
                  const pp = JSON.parse(fs.readFileSync(p, 'utf8'));
                  pp.version = version;
                  fs.writeFileSync(p, JSON.stringify(pp, null, 2) + '\n');
                  console.log('Platform:', pp.name, pp.version);
                }
              }
            }
          EOF
        env:
          VERSION: ${{ steps.versioning.outputs.version }}
      - name: Publish
        run: |
          npm config set provenance true
          ARGS="--access public --tag ${{ steps.versioning.outputs.npm_tag }}"
          if [[ "${{ steps.versioning.outputs.dry_run }}" == "true" ]]; then
            # --dry-run does not prevent prepublishOnly (napi prepublish) from
            # actually publishing platform packages to npm. Skip the lifecycle
            # script entirely so PR dry-runs never push real packages.
            ARGS="$ARGS --dry-run --ignore-scripts"
          fi
          npm publish $ARGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ===========================================================================
  #  Failure Reporting
  # ===========================================================================

  report-failure:
    name: Report Workflow Failure
    runs-on: ubuntu-latest
    needs: [build-lto, test-lto, publish-lto, build-nonlto, test-nonlto, publish-nonlto]
    if: always() && failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/create-failure-issue
        with:
          job-results: ${{ toJSON(needs) }}
          workflow-name: ${{ github.workflow }}
